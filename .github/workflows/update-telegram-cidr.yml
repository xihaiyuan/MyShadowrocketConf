name: Update Telegram CIDR

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and convert
        run: |
          mkdir -p rules
          curl -fsSL --retry 3 https://core.telegram.org/resources/cidr.txt -o cidr.txt
          grep -E '^[0-9a-fA-F:.]+/[0-9]+$' cidr.txt | awk '{
            if ($0 ~ /:/) print "IP-CIDR6," $0 ",no-resolve";
            else          print "IP-CIDR,"  $0 ",no-resolve";
          }' > rules/telegram-ip.list.new
          if [ "$(wc -l < rules/telegram-ip.list.new)" -lt 5 ]; then
            echo "Result too short, abort."
            exit 1
          fi
          mv rules/telegram-ip.list.new rules/telegram-ip.list

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain rules/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rules/telegram-ip.list
            git commit -m "chore: update Telegram CIDR"
            git push
          else
            echo "No changes."
          fi
